name: DXT render SVG to PNG
on:
  push:
    branches: [main]
    paths:
      - 'incoming/*.svg'
      - 'scripts/dxt_render_incoming.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dxt-render-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check cairosvg==2.7.1
      - name: Render and validate
        run: python scripts/dxt_render_incoming.py
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ manifests/
          if ! git diff --cached --quiet; then
            git commit -m "Render approved DXT SVG images to PNG"
            git push
          fi
